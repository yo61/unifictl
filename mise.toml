[tools]
# Exact, and Renovate moves each one; task moves with CI's TASK_VERSION as one group. uv is a
# range on purpose: see required-version in pyproject.toml.
uv = "0.12"
task = "3.54.0"
node = "22.23.3"
# The bundled bash completion script is linted by pre-commit; provision the
# linters here so the hooks find them without a separate manual install.
shellcheck = "0.11.0"
shfmt = "3.14.1"

[env]
# Stop ad-hoc `uv run`/`uv sync` from rewriting uv.lock as a side effect. This
# was previously set only in Taskfile.yaml, which covers `task`-invoked
# commands and nothing else -- so the bare `uv sync` in README.md relocked
# silently. Now that CI runs `uv sync --locked`, that drift is a hard failure.
# `task uv:lock` is the deliberate way to change the lockfile.
UV_FROZEN = "1"
_.python.venv = ".venv"
