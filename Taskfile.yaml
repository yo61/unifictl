version: "3"
silent: true

env:
  UV_FROZEN: "1"

tasks:
  default:
    desc: List available tasks
    cmds:
      - task --list-all

  dev:lint:
    desc: Run ruff check
    summary: >-
      ruff check over src and tests. It reports and does not fix; there is no --fix here, so a
      lint failure is yours to resolve.
    cmds:
      - uv run ruff check src tests

  dev:fmt:
    desc: Apply ruff format
    summary: >-
      ruff format over src and tests, rewriting files in place. dev:fmt-check is the same rules
      without the rewrite, and that is what the gate runs.
    cmds:
      - uv run ruff format src tests

  dev:fmt-check:
    desc: Check formatting without rewriting
    summary: >-
      Fails if anything is unformatted, without touching a file — the form dev:check runs. Note
      the pre-commit hook does NOT use this form: it runs `ruff format` with no --check, so it
      rewrites the file and then reports the hook as failed. So a commit can reformat under you;
      this task is the one that only reports.
    cmds:
      - uv run ruff format --check src tests

  dev:typecheck:
    desc: Run ty type checker
    summary: >-
      ty over src only. Note the asymmetry with dev:lint, which also covers tests: a type error in
      a test is not caught here, or anywhere else in the gate.
    cmds:
      - uv run ty check src

  dev:imports:
    desc: Enforce import boundaries (import-linter)
    summary: >-
      Enforces the two import-linter contracts in pyproject: infrastructure may import neither
      domain nor application, so the private-API client stays isolated and keeps mirroring
      unifi-mcp's documented contract; and the DDD layering commands -> application -> domain,
      where a higher layer may import a lower one but never the reverse. This catches the kind of
      coupling that type-checks and tests both pass.
    cmds:
      - uv run lint-imports

  dev:test:
    desc: Run the pytest suite
    summary: >-
      pytest with no arguments, so pyproject decides: testpaths is tests and --strict-markers is
      on, which means an unregistered marker is an error rather than a warning.
    cmds:
      - uv run pytest

  dev:check:
    desc: Full quality gate — lint, format-check, typecheck, imports, tests
    summary: >-
      The whole gate in order: lint, format-check, typecheck, imports, tests. It stops at the
      first failure, so a later stage can still be broken once an earlier one passes. It uses
      fmt-check rather than fmt, so it never rewrites a file.
    cmds:
      - task: dev:lint
      - task: dev:fmt-check
      - task: dev:typecheck
      - task: dev:imports
      - task: dev:test

  # Two separate traps, both of which produce a silent no-op rather than an
  # error, so neither is visible without deliberately testing for it:
  #
  #   1. A task-level `env:` block does not win. Task will not override a
  #      variable already present in the OS environment, which is where mise
  #      puts UV_FROZEN. Hence `env -u`.
  #   2. `env -u` alone is not enough either. If `uv` on PATH is a mise *shim*
  #      rather than the real binary, the shim re-derives [env] from mise.toml
  #      inside the child process and puts UV_FROZEN back after `env -u` has
  #      stripped it. `mise which` resolves past the shim to the real binary;
  #      `command -v` covers the case where uv is not mise-managed at all.
  uv:lock:
    desc: 'Re-lock uv.lock; the only command that should change it'
    summary: >-
      The only command that changes uv.lock. UV_FROZEN="1" is set in the Taskfile env block and
      again in mise.toml, so every other uv call here resolves against the lockfile and cannot
      rewrite it as a side effect — a deliberate bump comes through this task. Making that work
      takes both halves of the command: a task-level env: cannot override a variable already in
      the OS environment, hence `env -u`, and a mise shim would re-derive UV_FROZEN inside the
      child process, hence `mise which uv` to reach the real binary.
    cmds:
      - env -u UV_FROZEN "$(mise which uv 2>/dev/null || command -v uv)" lock

  dev:hooks:
    desc: Run all prek hooks against every file
    summary: >-
      Runs the prek hooks that apply at the default stage, against every file rather than just
      the staged ones. Not every hook: this config has two that are stage-restricted, and `prek
      run --all-files` without --stage skips them. Use it to check the tree before pushing,
      knowing it is not the whole hook set.
    cmds:
      - prek run --all-files

  dev:hooks-install:
    desc: Install git hooks (pre-commit, commit-msg, pre-push)
    summary: >-
      Installs the pre-commit, commit-msg and pre-push hooks. Run once per clone; nothing else
      here does it for you.
    cmds:
      - prek install --hook-type pre-commit --hook-type commit-msg --hook-type pre-push
