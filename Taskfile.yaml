version: "3"
silent: true

env:
  UV_FROZEN: "1"

tasks:
  default:
    desc: List available tasks
    cmds:
      - task --list-all

  dev:lint:
    desc: Run ruff check
    cmds:
      - uv run ruff check src tests

  dev:fmt:
    desc: Apply ruff format
    cmds:
      - uv run ruff format src tests

  dev:fmt-check:
    desc: Check formatting without rewriting
    cmds:
      - uv run ruff format --check src tests

  dev:typecheck:
    desc: Run ty type checker
    cmds:
      - uv run ty check src

  dev:imports:
    desc: Enforce import boundaries (import-linter)
    cmds:
      - uv run lint-imports

  dev:test:
    desc: Run the pytest suite
    cmds:
      - uv run pytest

  dev:check:
    desc: Full quality gate — lint, format-check, typecheck, imports, tests
    cmds:
      - task: dev:lint
      - task: dev:fmt-check
      - task: dev:typecheck
      - task: dev:imports
      - task: dev:test

  # Two separate traps, both of which produce a silent no-op rather than an
  # error, so neither is visible without deliberately testing for it:
  #
  #   1. A task-level `env:` block does not win. Task will not override a
  #      variable already present in the OS environment, which is where mise
  #      puts UV_FROZEN. Hence `env -u`.
  #   2. `env -u` alone is not enough either. If `uv` on PATH is a mise *shim*
  #      rather than the real binary, the shim re-derives [env] from mise.toml
  #      inside the child process and puts UV_FROZEN back after `env -u` has
  #      stripped it. `mise which` resolves past the shim to the real binary;
  #      `command -v` covers the case where uv is not mise-managed at all.
  uv:lock:
    desc: 'Re-lock uv.lock; the only command that should change it'
    summary: >-
      The only command that changes uv.lock. UV_FROZEN="1" is set in the Taskfile env block and
      again in mise.toml, so every other uv call here resolves against the lockfile and cannot
      rewrite it as a side effect — a deliberate bump comes through this task. Making that work
      takes both halves of the command: a task-level env: cannot override a variable already in
      the OS environment, hence `env -u`, and a mise shim would re-derive UV_FROZEN inside the
      child process, hence `mise which uv` to reach the real binary.
    cmds:
      - env -u UV_FROZEN "$(mise which uv 2>/dev/null || command -v uv)" lock

  dev:hooks:
    desc: Run all prek hooks against every file
    cmds:
      - prek run --all-files

  dev:hooks-install:
    desc: Install git hooks (pre-commit, commit-msg, pre-push)
    cmds:
      - prek install --hook-type pre-commit --hook-type commit-msg --hook-type pre-push
