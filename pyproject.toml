[project]
name = "unifictl"
version = "0.5.4"
description = "Imperative UniFi homelab actions the Integration API can't express"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = [
    "cyclopts==4.23.0",
    "httpx>=0.28",
    "questionary>=2.0",
    "rich>=13",
    "tomlkit>=0.13",
    "xdg-base-dirs>=6",
]

[project.scripts]
unifictl = "unifictl.cli:main"

[dependency-groups]
dev = [
    "hypothesis>=6",
    "import-linter>=2",
    "pexpect>=4",
    "pytest>=8",
    "pytest-cov>=5",
    "pytest-httpx>=0.30",
    "ruff>=0.6",
    "ty>=0.0.1a8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/unifictl"]

[tool.uv]
# Pins uv to the 0.12 series. `setup-uv` reads `tool.uv.required-version`
# (src/version/file-parser.ts), so CI and the sync-lockfile job install the
# same series `mise.toml` provides locally. That job commits a lockfile; it
# should not be generated by a uv nobody else runs.
#
# The floor is the minor, not a patch. mise hides releases younger than its
# `minimum_release_age`, so pinning to the newest patch resolves to a version
# mise will not install for days -- CI green, every local uv command refusing
# to run.
#
# Belt and braces, not the real guard: uv.lock's `revision` has been 3 across
# 0.10, 0.11 and 0.12, so a format change is not imminent. `uv sync --locked`
# failing in CI is what actually catches a lockfile that has drifted.
required-version = ">=0.12,<0.13"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.ruff.format]
quote-style = "double"

[tool.ty.rules]
# strict-by-default; tighten as needed

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
# test_cli.py monkeypatches sys.argv and calls main() (which invokes app() with
# no tokens, exercising the production argv-reading branch). Cyclopts can't tell
# this from a forgotten `app([])` and warns; the warning is a false positive.
filterwarnings = [
    "ignore:Cyclopts application invoked without tokens.*:UserWarning",
    # test_completion_bash_integration.py drives a real bash through pexpect,
    # which forks a pty. Python 3.12+ warns because pytest's process has
    # threads; the fork here is immediately followed by tty setup and execv in
    # the child, which is the only mode pexpect offers. Nothing to fix.
    "ignore:This process .* is multi-threaded, use of forkpty.*:DeprecationWarning",
]

[tool.importlinter]
root_package = "unifictl"

# The private-API client stays isolated so it faithfully mirrors unifi-mcp's
# documented contract (SPEC.md §3) — infrastructure must not depend on the
# domain rules or application use-cases.
[[tool.importlinter.contracts]]
name = "Client isolation: infrastructure imports neither domain nor application"
type = "forbidden"
source_modules = ["unifictl.infrastructure"]
forbidden_modules = ["unifictl.domain", "unifictl.application"]

# DDD layering: commands -> application -> domain (higher may import lower only).
[[tool.importlinter.contracts]]
name = "DDD layers"
type = "layers"
layers = [
    "unifictl.commands",
    "unifictl.application",
    "unifictl.domain",
]
