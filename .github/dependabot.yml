version: 2

# Commit type decides whether an update ships. release-please treats every
# visible changelog section as releasable, so `deps` both lists an update in
# the changelog and cuts a patch release, while `chore` does neither. The line
# is drawn at what reaches users: only updates that change the published
# package use `deps`. See yo61/jobhound
# decisions/2026-08-13-dependency-updates-and-releases.md.
updates:
  - package-ecosystem: "pre-commit"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    commit-message:
      prefix: "chore(deps)"
    groups:
      hooks:
        patterns: ["*"]

  # Python dependencies. The uv ecosystem updates uv.lock as well as the
  # pyproject.toml constraints; pip would leave the lock stale.
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    # Runtime dependencies ship, so they keep `deps`. The dev group ships
    # nothing, so `prefix-development` routes it to `chore(deps)`. The groups
    # are split by dependency-type so every PR has an unambiguous prefix.
    commit-message:
      prefix: "deps"
      prefix-development: "chore(deps)"
    groups:
      uv-production:
        dependency-type: "production"
        update-types: ["minor", "patch"]
      uv-development:
        dependency-type: "development"
        update-types: ["minor", "patch"]

  # GitHub Actions. Pins are SHAs with version comments; Dependabot
  # rewrites both. Majors stay outside the group so they arrive singly.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    commit-message:
      prefix: "chore(deps)"
    groups:
      actions-minor-patch:
        update-types: ["minor", "patch"]
