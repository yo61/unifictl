name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check-matrix:
    name: py${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9  # v9.0.0
        with:
          enable-cache: true
          python-version: ${{ matrix.python-version }}
      - uses: go-task/setup-task@3be4020d41929789a01026e0e427a4321ce0ad44  # v2.0.0
        with:
          version: 3.x
      - run: uv sync
      - run: task dev:check

  check:
    name: Lint, typecheck, test
    needs: check-matrix
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
      - if: needs.check-matrix.result != 'success'
        run: exit 1

  commitlint:
    name: Conventional Commits
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false
      # Fork of wagoid/commitlint-github-action. Upstream is unmaintained: no
      # commit to master since 2025-01-14, and it pins @commitlint/ensure ^19,
      # two majors behind. This fork runs commitlint v21 on node 24, and pins its
      # runtime image by digest so the SHA pin here cannot be worked around.
      - uses: yo61/commitlint-github-action@501ff7bb31eb7133c871318c877d0e43cd1ff500  # v6.3.0 (digest-pinned)
        with:
          configFile: commitlint.config.mjs

  zizmor:
    name: zizmor
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        with:
          persist-credentials: false
      - uses: zizmorcore/zizmor-action@192e21d79ab29983730a13d1382995c2307fbcaa  # v0.5.7
        with:
          advanced-security: false
          persona: regular
          version: v1.26.1
