name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check-matrix:
    name: py${{ matrix.python-version }}
    runs-on: ubuntu-26.04
    strategy:
      fail-fast: false
      matrix:
        # The supported range, matching requires-python, not a pin: widen it by hand when
        # a Python is added to or dropped from support.
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7  # v10.2.0
        with:
          enable-cache: true
          python-version: ${{ matrix.python-version }}
      - uses: go-task/setup-task@a00fbb05ce67b35648be3c78cbc9fd85354c757e  # v2.2.0
        env:
          # setup-task adds the v itself, so the value is the bare version.
          # renovate: datasource=github-releases depName=go-task/task extractVersion=^v(?<version>.+)$
          TASK_VERSION: 3.54.0
        with:
          version: ${{ env.TASK_VERSION }}
      # --locked, not --frozen: --frozen installs from the lockfile without
      # checking it is current, so drift merges silently. Expect one red run
      # on a Release PR -- release-please pushes the version bump, this fails,
      # then release.yaml's sync-lockfile commits the lockfile and it passes.
      - run: uv sync --locked
      - run: task dev:check

  check:
    name: Lint, typecheck, test
    needs: check-matrix
    if: ${{ always() }}
    runs-on: ubuntu-26.04
    steps:
      - if: needs.check-matrix.result != 'success'
        run: exit 1

  commitlint:
    name: Conventional Commits
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-26.04
    permissions:
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      # Fork of wagoid/commitlint-github-action. Upstream is unmaintained: no
      # commit to master since 2025-01-14, and it pins @commitlint/ensure ^19,
      # two majors behind. This fork runs commitlint v21 on node 24, and pins its
      # runtime image by digest so the SHA pin here cannot be worked around.
      - uses: yo61/commitlint-github-action@501ff7bb31eb7133c871318c877d0e43cd1ff500  # v6.3.0 (digest-pinned)
        with:
          configFile: commitlint.config.mjs

  # This repo rebase-merges, so every commit in a PR lands on main and becomes
  # release-note material release-please parses. Fixups must be squashed before
  # merge; `git commit --fixup` leaves the markers and `git rebase -i
  # --autosquash` collapses them. commitlint above validates each subject's
  # form -- this checks the commit *set* is curated.
  commit-hygiene:
    name: Commit hygiene
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-26.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Reject fixup, squash, and WIP commits
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          log=$(git log --format='%h%x09%s' "$BASE_SHA..$HEAD_SHA")
          uncurated=0
          while IFS=$'\t' read -r sha subject; do
            [ -n "$sha" ] || continue
            if printf '%s' "$subject" \
              | grep -qiE '^(fixup|squash|amend)!|^wip([[:space:]:!]|$)'; then
              echo "::error::uncurated commit: $sha $subject"
              uncurated=1
            fi
          done <<< "$log"
          if [ "$uncurated" -ne 0 ]; then
            echo "Squash the commits above before merge: git rebase -i --autosquash"
            exit 1
          fi
          echo "commit set is curated"

  zizmor:
    name: zizmor
    runs-on: ubuntu-26.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      # The zizmor hook from .pre-commit-config.yaml, so its rev is the one zizmor pin. The
      # token lets zizmor run its online audits (impostor commits, known-vulnerable actions);
      # without one it skips them and still passes.
      - uses: j178/prek-action@4e14d07f9231acabce116ccfca13b13dd9755ece  # v3.0.0
        env:
          GH_TOKEN: ${{ github.token }}
          # renovate: datasource=github-releases depName=j178/prek extractVersion=^v(?<version>.+)$
          PREK_VERSION: 0.5.4
        with:
          prek-version: ${{ env.PREK_VERSION }}
          extra-args: zizmor --all-files
