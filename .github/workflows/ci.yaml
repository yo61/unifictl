name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      # No python-version: uv takes it from .python-version, the one pin.
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e  # v10.3.2
        with:
          enable-cache: true
          # Distinguishes this job's cache key from the matrix job on the same Python. Without
          # it both race on the same key and one fails to save.
          cache-suffix: lint
      # The ruff, ty and import-linter hooks are `uv run --no-sync`, so the venv must exist
      # before prek runs.
      - run: uv sync --locked
      # shellcheck and shfmt at the versions mise.toml pins, so CI and local hooks run the same
      # binaries. uv comes from setup-uv; env: false keeps mise.toml's [env] out of later steps.
      - uses: jdx/mise-action@8418fedb1110381a0d3ba51a7a415d7c1b884550  # v5.2.2
        with:
          install_args: shellcheck shfmt
          env: false
      # Runs the hooks from .pre-commit-config.yaml rather than repeating them here, so local
      # and CI cannot drift. commitlint is a commit-msg hook and pytest a pre-push one, so
      # --all-files skips both; the Conventional Commits job and check-matrix cover them.
      - uses: j178/prek-action@44924fe9ef4a6f88253c4b6b1bf11c689d3ce53d  # v3.1.0
        env:
          # renovate: datasource=github-releases depName=j178/prek extractVersion=^v(?<version>.+)$
          PREK_VERSION: 0.5.7
          # jactionlint's online rules (yo61/global decisions/2026-10-17-retire-zizmor.md); local
          # hooks stay offline.
          JACTIONLINT_ONLINE: 1
          GITHUB_TOKEN: ${{ github.token }}
        with:
          prek-version: ${{ env.PREK_VERSION }}

  check-matrix:
    name: py${{ matrix.python-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e  # v10.3.2
        with:
          enable-cache: true
          python-version: ${{ matrix.python-version }}
      - uses: go-task/setup-task@a00fbb05ce67b35648be3c78cbc9fd85354c757e  # v2.2.0
        with:
          version: 3.x
      # --locked, not --frozen: --frozen installs from the lockfile without
      # checking it is current, so drift merges silently. Expect one red run
      # on a Release PR -- release-please pushes the version bump, this fails,
      # then release.yaml's sync-lockfile commits the lockfile and it passes.
      - run: uv sync --locked
      - run: task dev:check

  check:
    name: Lint, typecheck, test
    # The ruleset requires this name, so lint rolls up here rather than as a new required check.
    needs: [lint, check-matrix]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - if: needs.lint.result != 'success' || needs.check-matrix.result != 'success'
        run: exit 1

  commitlint:
    name: Conventional Commits
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      # Fork of wagoid/commitlint-github-action. Upstream is unmaintained: no
      # commit to master since 2025-01-14, and it pins @commitlint/ensure ^19,
      # two majors behind. This fork runs commitlint v21 on node 24, and pins its
      # runtime image by digest so the SHA pin here cannot be worked around.
      - uses: yo61/commitlint-github-action@501ff7bb31eb7133c871318c877d0e43cd1ff500  # v6.3.0 (digest-pinned)
        with:
          configFile: commitlint.config.mjs
